#  description of this project
description: |-
  Ansible repo designed to set up machine with necessary Dev(Ops) tooling. Included various browsers, spotify and calibre for convenience.
# How to use this project

content: |-
The playbook currently installs the following:

  * Git
  * Docker
  * Docker-compose
  * Azure CLI
  * AWS CLI
  * Bash-it
  * Terraform
  * Kubectl
  * Helm
  * VS Code
  * Molecule (in virtualenv)
  * Multiboot
  * Chrome
  * Brave
  * Tor
  * Spotify
  * Telegram
  * Zoom
  * Slack
  * Minikube
  * Lens
  * SSH Keys

# How to use this project
usage: |-
  Here are some examples of how you can use this module in your inventory structure:

  ```
  1. Clone this repo to your local disk.
  2. Change the encrypted group vars to include your git variables (see git role defaults).
  3. Open in terminal, and run:

    `make install`  
  ```