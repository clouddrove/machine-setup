---
- name: AWS CLI
  block:
    - name: Download AWS CLI v2
      shell: |
        if ! command -v aws &> /dev/null
        then
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip awscliv2.zip
        fi
      args:
        creates: "/usr/local/bin/aws"

    - name: Install AWS CLI v2
      shell: ./aws/install
      args:
        creates: "/usr/local/bin/aws"

    - name: Cleanup AWS CLI v2 installation files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - aws
        - awscliv2.zip
        

- name: Kubectl
  block:
    - name: Add GCloud GPG key
      shell: |
        curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | apt-key --keyring /usr/share/keyrings/cloud.google.gpg add -
      args:
        creates: /usr/share/keyrings/cloud.google.gpg

    - name: Add Kubernetes repository
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://apt.kubernetes.io/ kubernetes-xenial main"
        state: present
        filename: kubernetes.list
        
    - name: Install kubectl
      apt:
        name: kubectl
        state: present
        update_cache: yes

- name: Helm
  block:      
    - name: Install Helm
      shell: |
        curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        chmod 700 get_helm.sh
        ./get_helm.sh
      args:
        creates: /usr/local/bin/helm
            
    - name: Cleanup Helm installation script
      file:
        path: get_helm.sh
        state: absent

- name: Terraform
  block:
    - name: Add Terraform GPG key
      shell: |
        curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
      args:
        creates: /usr/share/keyrings/hashicorp-archive-keyring.gpg

    - name: Add Terraform repository
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com {{ lsb_release_name }} main"
        state: present
        filename: hashicorp.list
        
    - name: Install Terraform
      apt:
        name: terraform
        state: present
        update_cache: yes

- name: Docker
  block:
    - name: Add Docker GPG key
      shell: |
        curl -fsSL https://download.docker.com/linux/debian/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
      args:
        creates: /usr/share/keyrings/docker-archive-keyring.gpg

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        state: present
        filename: docker.list

    - name: Install Docker
      apt:
        name: docker-ce
        state: present

    - name: Start and enable Docker service
      service:
        name: docker
        state: started
        enabled: yes


- name: Node.js
  block:
    - name: Add Node.js repository
      apt_repository:
        repo: "deb https://deb.nodesource.com/node_14.x {{ ansible_distribution_release }} main"
        state: present
      when: ansible_os_family == 'Debian'

    - name: Add GPG key for Node.js repository
      shell: |
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource.gpg | sudo gpg --dearmor -o /usr/share/keyrings/nodesource-archive-keyring.gpg
      args:
        creates: /usr/share/keyrings/nodesource-archive-keyring.gpg
      when: ansible_os_family == 'Debian'

    - name: Install Node.js
      apt:
        name: nodejs
        state: present
      when: ansible_os_family == 'Debian'


- name: Minikube
  block:
    - name: Download Minikube
      get_url:
        url: "https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64"
        dest: /usr/local/bin/minikube
        mode: +x

    - name: Install kubectl
      apt:
        name: kubectl
        state: present

    - name: Install conntrack
      apt:
        name: conntrack
        state: present

    - name: Install socat
      apt:
        name: socat
        state: present

- name: Hubstaff
  block:
    - name: Download Hubstaff Installation Package
      get_url:
        url: https://example.com/hubstaff_installer.deb
        dest: /tmp/hubstaff_installer.deb

    - name: Install Dependencies (if required).
      apt:
        name: libgtk2.0
        state: present

    - name: Install Hubstaff
      shell: dpkg -i /tmp/hubstaff_installer.deb

    - name: Configure Hubstaff Settings
  handlers:
    - name: Restart Hubstaff (if required)


- name: Slack
  block:
    - name: Download Slack Installation Package
      get_url:
        url: https://downloads.slack-edge.com/linux_releases/slack-desktop-4.22.0-amd64.deb
        dest: /tmp/slack.deb

    - name: Install Dependencies (if required)
      apt:
        name: libappindicator1 libindicator7
        state: present

    - name: Install Slack
      shell: dpkg -i /tmp/slack.deb

- name: Chrome
  block:
    - name: Download Google Chrome Installation Package
      get_url:
        url: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        dest: /tmp/google-chrome.deb

    - name: Install Google Chrome
      shell: dpkg -i /tmp/google-chrome.deb


- name: Visual Studio Code
  block:
    - name: Download Visual Studio Code Installer
      win_get_url:
        url: https://vscode-update.azurewebsites.net/latest/win32-x64/stable
        dest: C:\Temp\VSCodeSetup.exe

    - name: Install Visual Studio Code
      win_command: C:\Temp\VSCodeSetup.exe /verysilent /norestart


- name: Zoom
  block:
    - name: Download Zoom Installer
      get_url:
        url: https://zoom.us/client/latest/zoom_amd64.deb
        dest: /tmp/zoom_amd64.deb

    - name: Install Zoom
      shell: dpkg -i /tmp/zoom_amd64.deb

    - name: Cleanup Zoom Installer
      file:
        path: /tmp/zoom_amd64.deb
        state: absent

- name: Azure CLI
  block:
    - name: Download Azure CLI installation script
      get_url:
        url: https://aka.ms/InstallAzureCLIDeb
        dest: /tmp/install_azure_cli.sh

    - name: Make installation script executable
      file:
        path: /tmp/install_azure_cli.sh
        mode: +x

    - name: Run Azure CLI installation script
      shell: /tmp/install_azure_cli.sh
      register: azure_cli_install_result
      ignore_errors: yes

    - name: Clean up installation script
      file:
        path: /tmp/install_azure_cli.sh
        state: absent


- name: GCP CLI
  block:
    - name: Download GCP CLI Installation Script
      get_url:
        url: https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-sdk-install.sh
        dest: /tmp/google-cloud-sdk-install.sh

    - name: Make installation script executable
      file:
        path: /tmp/google-cloud-sdk-install.sh
        mode: +x

    - name: Run GCP CLI Installation Script
      shell: /tmp/google-cloud-sdk-install.sh
      register: gcp_cli_install_result

    - name: Clean up installation script
      file:
        path: /tmp/google-cloud-sdk-install.sh
        state: absent