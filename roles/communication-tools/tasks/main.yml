---
# -------------------------------------------------------------------------#
# ------------------------Slack--------------------------------------------#
- name: apt-get update
  become: yes
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags: ['slack', 'communication-tools', 'update']

- name: install gdebi
  become: yes
  ansible.builtin.apt:
    name: gdebi
    state: present
  tags: ['slack', 'communication-tools', 'prerequisites']

- name: Check if slack is installed
  ansible.builtin.command: dpkg-query -W slack-desktop
  register: check_slack
  failed_when: false
  changed_when: false
  tags: ['slack', 'communication-tools', 'check']

- name: Download Ubuntu slack package
  become: yes
  ansible.builtin.command: "{{ slack_package }}"
  args:
    creates: "{{ temp_dir }}/slack-desktop-{{ slack_version }}-amd64.deb"
  when: check_slack.rc == 1
  retries: 3
  delay: 5
  tags: ['slack', 'communication-tools', 'download']

- name: Install Slack
  become: yes
  ansible.builtin.apt:
    deb: "{{ temp_dir }}/slack-desktop-{{ slack_version }}-amd64.deb"
    state: present
  when: check_slack.rc == 1 and ansible_architecture != 'aarch64'
  tags: ['slack', 'communication-tools', 'install']

- name: Skip Slack on ARM64
  ansible.builtin.debug:
    msg: "⚠️  Slack is not available for ARM64 architecture. Skipping installation."
  when: ansible_architecture == 'aarch64'
  tags: ['slack', 'communication-tools']

# -------------------------------------------------------------------------#
# ------------------------Zoom---------------------------------------------#

- name: Set Zoom package architecture
  ansible.builtin.set_fact:
    zoom_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
  tags: ['zoom']

- name: Set Zoom package name
  ansible.builtin.set_fact:
    zoom_package: "zoom_{{ zoom_arch }}.deb"
  tags: ['zoom']

- name: Download Zoom package
  become: yes
  ansible.builtin.get_url:
    url: "https://zoom.us/client/latest/{{ zoom_package }}"
    dest: "{{ temp_dir }}/{{ zoom_package }}"
    timeout: 30
  retries: 3
  delay: 5
  when: ansible_architecture != 'aarch64'
  tags: ['zoom', 'communication-tools', 'download']

- name: Skip Zoom on ARM64
  ansible.builtin.debug:
    msg: "⚠️  Zoom is not available for ARM64 architecture. Skipping installation."
  when: ansible_architecture == 'aarch64'
  tags: ['zoom', 'communication-tools']

- name: Install zoom
  become: yes
  ansible.builtin.apt:
    deb: "{{ temp_dir }}/{{ zoom_package }}"
    state: present
  when: ansible_architecture != 'aarch64'
  tags: ['zoom', 'communication-tools', 'install']

# --------------------------------------------------------------------------#
# ------------------------Telegram------------------------------------------#

- name: Add Telegram repository
  become: yes
  ansible.builtin.apt_repository:
    repo: 'ppa:atareao/telegram'
  register: telegram_repo_result
  failed_when: false
  tags: ['telegram', 'communication-tools', 'repository']

- name: Update apt cache after adding Telegram repo
  become: yes
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: telegram_repo_result is succeeded
  tags: ['telegram', 'communication-tools']

- name: Install Telegram
  become: yes
  ansible.builtin.package:
    name: telegram
    state: present
  when: telegram_repo_result is succeeded
  register: telegram_install_result
  failed_when: false
  tags: ['telegram', 'communication-tools', 'install']

- name: Skip Telegram if installation failed
  ansible.builtin.debug:
    msg: "⚠️  Telegram installation skipped (PPA may not be available for this Ubuntu version)"
  when: telegram_repo_result is failed or telegram_install_result is failed
  tags: ['telegram', 'communication-tools']

# --------------------------------------------------------------------------#
# ------------------------Discord------------------------------------------#

- name: Check if Discord is already installed
  ansible.builtin.command: discord --version
  register: discord_check
  failed_when: false
  changed_when: false
  tags: ['discord', 'communication-tools']

- name: Download Discord .deb package
  become: yes
  ansible.builtin.shell: |
    curl -L -o {{ temp_dir }}/discord.deb "https://discord.com/api/download?platform=linux&format=deb"
  args:
    creates: "{{ temp_dir }}/discord.deb"
  when: discord_check.rc != 0 and ansible_architecture != 'aarch64'
  register: discord_download_result
  retries: 3
  delay: 5
  tags: ['discord', 'communication-tools', 'download']

- name: Install Discord
  become: yes
  ansible.builtin.apt:
    deb: "{{ temp_dir }}/discord.deb"
    state: present
  when: discord_download_result is succeeded and ansible_architecture != 'aarch64'
  register: discord_install_result
  tags: ['discord', 'communication-tools', 'install']

- name: Skip Discord on ARM64
  ansible.builtin.debug:
    msg: "⚠️  Discord is not available for ARM64 architecture. Skipping installation."
  when: ansible_architecture == 'aarch64'
  tags: ['discord', 'communication-tools']

- name: Verify Discord installation
  become: yes
  ansible.builtin.command: discord --version
  register: discord_version
  failed_when: false
  changed_when: false
  when: discord_install_result is succeeded or discord_check.rc == 0
  tags: ['discord', 'communication-tools']

- name: Print message after Discord installation
  ansible.builtin.debug:
    msg: "Discord has been successfully installed"
  when: discord_install_result is succeeded or discord_check.rc == 0
  tags: ['discord', 'communication-tools']

# --------------------------------------------------------------------------#
# ------------------------Microsoft Teams-----------------------------------#

- name: Check if Teams is already installed
  ansible.builtin.command: teams --version
  register: teams_check
  failed_when: false
  changed_when: false
  tags: ['teams', 'communication-tools']

- name: Set Teams architecture
  ansible.builtin.set_fact:
    teams_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'x86_64' }}"
  tags: ['teams']

- name: Set Teams download URL
  ansible.builtin.set_fact:
    teams_download_url: "https://teams.microsoft.com/downloads/desktopurl?env=production&plat=linux&arch={{ teams_arch }}&download=true&linuxArchiveType=deb"
  tags: ['teams']

- name: Download Microsoft Teams package
  become: yes
  ansible.builtin.shell: |
    curl -L -o {{ temp_dir }}/teams-{{ teams_arch }}.deb "{{ teams_download_url }}"
  args:
    creates: "{{ temp_dir }}/teams-{{ teams_arch }}.deb"
  when: teams_check.rc != 0
  register: teams_download_result
  retries: 3
  delay: 5
  tags: ['teams', 'communication-tools', 'download']

- name: Install Microsoft Teams
  become: yes
  ansible.builtin.apt:
    deb: "{{ temp_dir }}/teams-{{ teams_arch }}.deb"
    state: present
  when: teams_download_result is succeeded and ansible_architecture != 'aarch64'
  register: teams_install_result
  tags: ['teams', 'communication-tools', 'install']

- name: Skip Teams on ARM64
  ansible.builtin.debug:
    msg: "⚠️  Microsoft Teams has limited ARM64 support. Skipping installation."
  when: ansible_architecture == 'aarch64'
  tags: ['teams', 'communication-tools']

- name: Verify Teams installation
  become: yes
  ansible.builtin.command: teams --version
  register: teams_version
  failed_when: false
  changed_when: false
  when: teams_install_result is succeeded and ansible_architecture != 'aarch64'
  tags: ['teams', 'communication-tools']

- name: Print message after Teams installation
  ansible.builtin.debug:
    msg: "Microsoft Teams has been successfully installed"
  when: teams_install_result is succeeded and ansible_architecture != 'aarch64'
  tags: ['teams', 'communication-tools']
...
