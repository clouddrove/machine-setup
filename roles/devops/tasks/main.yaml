---
# -----------------------------------------------------------------------#
# ------------------------Pre-requisite Packages-------------------------#

- name: fix broken Packages.
  become: yes
  ansible.builtin.shell: apt --fix-broken install -y
  ignore_errors: yes

- name: Update the server
  become: yes
  ansible.builtin.apt:
    upgrade: 'safe'
    update_cache: true
  tags: ['update', 'server']

- name: Install Pre-requisite Packages
  become: yes
  ansible.builtin.apt:
    name: "{{ prereq_pkgs }}"
    state: 'present'
  tags: ['install', 'packages', 'devops']

# ---------------------------------------------------------------------------#
# ------------------------AWS_CLI--------------------------------------------#

- name: Uninstall AWS CLI V1
  become: yes
  ansible.builtin.apt:
    name: 'awscli'
    state: 'absent'
  tags: ['uninstall', 'awscli']

- name: Delete the old AWS CLI V2 temp files
  become: false
  ansible.builtin.file:
    path: "{{ temp_dir }}/aws"
    state: 'absent'
  tags: ['cleanup', 'awscli']

- name: Set AWS CLI download URL based on architecture
  ansible.builtin.set_fact:
    aws_cli_download_url: "{{ aws_cli_base_url }}{{ 'aarch64' if ansible_architecture == 'aarch64' else 'x86_64' }}.zip"
  tags: ['awscli']

- name: Download and unzip the AWS CLI V2
  become: false
  ansible.builtin.unarchive:
    src: "{{ aws_cli_download_url }}"
    dest: "{{ temp_dir }}"
    remote_src: true
  tags: ['download', 'awscli']
  retries: 3
  delay: 5

- name: Run the AWS CLI V2 installer
  become: yes
  ansible.builtin.shell: "{{ temp_dir }}/aws/install --update"
  tags: ['install', 'awscli']
  register: download_result
  until: download_result is succeeded
  retries: 3
  delay: 10

- name: Verify AWS CLI installation and print version
  become: yes
  ansible.builtin.command: aws --version
  register: aws_version
  changed_when: false
  when: download_result is succeeded

- name: Print message after AWS CLI installation
  ansible.builtin.debug:
    msg: |
       "AWS CLI has been successfully installed and version is
        {{ aws_version.stdout.split(' ')[0] }}"
  when: download_result is succeeded

# -----------------------------------------------------------------------------#
# ------------------------KUBECTL----------------------------------------------#

- name: Install Pre-requisite Packages
  become: yes
  ansible.builtin.apt:
    name: "{{ prereq_pkgs }}"
    state: present

- name: Set kubectl repository URL based on architecture
  ansible.builtin.set_fact:
    kubectl_repo: "deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by={{ kubectl_keyring }}] https://pkgs.k8s.io/core:/stable:/v1.28/deb/ /"
  tags: ['kubectl']

- name: Create keyring directory for kubectl
  become: yes
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  tags: ['kubectl']

- name: Download kubectl GPG key
  become: yes
  ansible.builtin.get_url:
    url: "{{ kubectl_apt_key }}"
    dest: "{{ kubectl_keyring }}"
    mode: '0644'
  register: kubectl_key_download
  tags: ['kubectl', 'apt_key']

- name: Import kubectl GPG key to apt keyring
  become: yes
  ansible.builtin.shell: |
    gpg --dearmor < {{ kubectl_keyring }} > {{ kubectl_keyring }}.gpg
    mv {{ kubectl_keyring }}.gpg {{ kubectl_keyring }}
  when: kubectl_key_download is succeeded
  tags: ['kubectl', 'apt_key']

- name: Add kubectl repository
  become: yes
  ansible.builtin.apt_repository:
    repo: "{{ kubectl_repo }}"
    filename: kubernetes
  tags: ['kubectl', 'repository']

- name: Install kubectl
  become: yes
  ansible.builtin.apt:
    name: kubectl
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: download_result
  until: download_result is succeeded
  retries: 3
  delay: 10
  tags: ['kubectl', 'install']

- name: Verify Kubectl installation and print version
  become: yes
  ansible.builtin.command: kubectl version --client
  register: kubectl_version_output
  changed_when: false
  when: download_result is succeeded

- name: Print message after Kubectl installation
  ansible.builtin.debug:
    msg: |
      "Kubectl has been successfully installed and
        {{ kubectl_version_output.stdout_lines[0] }}"
  when: download_result is succeeded

# -----------------------------------------------------------------------------#
# ------------------------HELM-------------------------------------------------#

- name: Check if Helm is already installed
  ansible.builtin.command: helm version --client
  register: helm_check
  failed_when: false
  changed_when: false
  tags: ['helm']

- name: Install Helm via official script
  become: yes
  ansible.builtin.shell: |
    curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  when: helm_check.rc != 0
  register: helm_install_result
  retries: 3
  delay: 5
  tags: ['helm', 'install']

- name: Verify Helm installation and print version
  become: yes
  ansible.builtin.command: helm version --client
  register: helm_version_output
  changed_when: false
  when: helm_install_result is succeeded or helm_check.rc == 0
  tags: ['helm']

- name: Print message after Helm installation
  ansible.builtin.debug:
    msg: |
      "Helm has been successfully installed and version is
       {{ helm_version_output.stdout_lines[0] }}"
  when: helm_install_result is succeeded or helm_check.rc == 0
  tags: ['helm']

- name: Install Helm and enable auto-completion
  become: yes
  block:

    - name: Check if bash_completion.d directory exists
      ansible.builtin.stat:
        path: /etc/bash_completion.d
      register: bash_completion_dir
      tags: ['helm', 'completion']

    - name: Create bash_completion.d directory if it does not exist
      ansible.builtin.file:
        path: /etc/bash_completion.d
        state: directory
        mode: '0755'
      when: not bash_completion_dir.stat.exists
      tags: ['helm', 'completion']

    - name: Enable Helm auto-completion
      become: yes
      ansible.builtin.shell: helm completion bash > /etc/bash_completion.d/helm
      args:
        creates: /etc/bash_completion.d/helm
      tags: ['helm', 'completion']

- name: Verify Helm installation
  become: yes
  ansible.builtin.command: helm version --short
  register: helm_version
  changed_when: false
  when: download_result is succeeded

- name: Print message after Kubectl installation
  ansible.builtin.debug:
    msg: |
      "Helm has been successfully installed and version is
         {{ helm_version.stdout_lines[0].split('+')[0] }}"
  when: download_result is succeeded

# -------------------------------------------------------#
# ------------------------DOCKER-------------------------#

- name: Update apt
  become: yes
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Set Docker repository URL based on architecture
  ansible.builtin.set_fact:
    docker_repo: "deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
  tags: ['docker']

- name: Add Docker GPG Key
  become: yes
  ansible.builtin.apt_key:
    url: "{{ docker_apt_url }}"
    state: present
  tags: ['docker']

- name: Add Docker Repository
  become: yes
  ansible.builtin.apt_repository:
    repo: "{{ docker_repo }}"
  tags: ['docker']

- name: Update apt
  become: yes
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install Docker
  become: yes
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
  register: download_result
  until: download_result is succeeded
  retries: 3
  delay: 10
  notify: restart docker
  tags: ['docker', 'install']

- name: Verify Docker installation and print version
  become: yes
  ansible.builtin.command: docker --version
  register: docker_version
  changed_when: false
  when: download_result is succeeded

- name: Print message after docker installation
  ansible.builtin.debug:
    msg: "Docker has been successfully installed and
      {{ docker_version.stdout_lines[0] }}"
  when: download_result is succeeded

# ---------------------------------------------------------------#
# ------------------------DOCKER-COMPOSE-------------------------#

- name: Set Docker Compose download URL based on architecture
  ansible.builtin.set_fact:
    docker_compose_download_url: "https://github.com/docker/compose/releases/download/v{{ compose_version }}/docker-compose-Linux-{{ 'aarch64' if ansible_architecture == 'aarch64' else 'x86_64' }}"
  tags: ['docker-compose']

- name: Download and install docker-compose
  become: yes
  ansible.builtin.get_url:
    url: "{{ docker_compose_download_url }}"
    dest: /usr/local/bin/docker-compose
    mode: 'u+x,g+x'
    timeout: 30
  register: download_result
  until: download_result is succeeded
  retries: 5
  delay: 10

- name: Ensure Docker group exists
  become: yes
  ansible.builtin.group:
    name: docker
    state: present

- name: Add User to Docker Group
  become: yes
  ansible.builtin.user:
    append: true
    groups: docker
    name: "{{ ansible_user_id }}"

- name: Verify Docker-compose installation and print version
  become: yes
  ansible.builtin.command: docker-compose version --short
  register: docker_compose_version
  changed_when: false
  when: download_result is succeeded

- name: Print message after docker-compose installation
  ansible.builtin.debug:
    msg: |
     "Docker-compose has been successfully installed and
       {{ docker_compose_version.stdout }}"
  when: download_result is succeeded

# -------------------------------------------------------#
# ------------------------Git----------------------------#

- name: Install git
  become: yes
  ansible.builtin.apt:
    name: git
    state: present
    update_cache: true
  register: download_result

- name: Set git config user
  ansible.builtin.set_fact:
    git_config_user: "{{ ansible_user_id | default('root') }}"
    git_config_home: "{{ '/root' if ansible_user_id == 'root' or ansible_user_id is not defined else '/home/' + ansible_user_id }}"
  tags: ['git']

- name: Create user dir
  become: yes
  ansible.builtin.file:
    path: "{{ git_config_home }}"
    state: directory
    mode: '0755'
  tags: ['git']

- name: Copy git config
  become: yes
  ansible.builtin.template:
    src: gitconfig.j2
    dest: "{{ git_config_home }}/.gitconfig"
    owner: "{{ git_config_user }}"
    mode: '0640'
  tags: ['git']

- name: Verify Git installation and print version
  become: yes
  ansible.builtin.command: git --version
  register: git_version
  changed_when: false
  when: download_result is succeeded

- name: Print message after git installation
  ansible.builtin.debug:
    msg: "Git has been successfully installed and {{ git_version.stdout }}"
  when: download_result is succeeded

# -------------------------------------------------------#
# ------------------------Lens---------------------------#

- name: Import Lens Desktop public security key
  become: yes
  ansible.builtin.apt_key:
    url: "{{ lens_apt_url }}"
    state: present
    keyring: "{{ lens_keyring }}"

- name: Add the Lens Desktop repository
  become: yes
  ansible.builtin.apt_repository:
    repo: "{{ lens_repository }}"
    state: present
    filename: lens

- name: Set priority for the stable channel
  become: yes
  ansible.builtin.copy:
    content: |
      Package: *
      Pin: release a=stable
      Pin-Priority: 800
    dest: /etc/apt/preferences.d/lens
    mode: '0644'

- name: Install or update Lens Desktop
  become: yes
  ansible.builtin.apt:
    update_cache: true
    name: lens
    state: present
  register: download_result
  until: download_result is succeeded
  retries: 3
  delay: 10
  when: ansible_architecture != 'aarch64'
  tags: ['lens', 'install']

- name: Skip Lens Desktop on ARM64
  ansible.builtin.debug:
    msg: "⚠️  Lens Desktop is not available for ARM64 architecture. Skipping installation."
  when: ansible_architecture == 'aarch64'
  tags: ['lens']

- name: Print message after Lens installation
  ansible.builtin.debug:
    msg: "Lens has been successfully installed."
  when: download_result is succeeded and ansible_architecture != 'aarch64'
  tags: ['lens']

# -------------------------------------------------------#
# ------------------------TF_SWITCH-------------------------#

- name: Check if tfswitch is already installed
  become: false
  ansible.builtin.command: which tfswitch
  register: tfswitch_check
  failed_when: false
  changed_when: false

- name: Download and execute the tf-switcher installation script
  become: yes
  ansible.builtin.shell: "{{ tfswitch_url }}"
  register: download_result
  when: tfswitch_check.rc != 0
  retries: 3
  delay: 5

- name: Verify tfswitch installation and print version
  become: yes
  ansible.builtin.command: tfswitch --version
  register: tfswitch_version
  changed_when: false
  when: download_result is succeeded or tfswitch_check.rc == 0

- name: Print message after tfswitch installation
  ansible.builtin.debug:
    msg: |
     "tfswitch has been successfully installed and
       {{ tfswitch_version.stdout }}"
  when: tfswitch_version is defined

# -----------------------------------------------------------------------------#
# ------------------------VISUAL STUDIO CODE-----------------------------------#

- name: Create keyring directory for VS Code
  become: yes
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'
  tags: ['vscode']

- name: Download VS Code GPG key
  become: yes
  ansible.builtin.get_url:
    url: "{{ vscode_apt_key }}"
    dest: "{{ vscode_keyring }}"
    mode: '0644'
  register: vscode_key_download
  tags: ['vscode', 'apt_key']

- name: Import VS Code GPG key to apt keyring
  become: yes
  ansible.builtin.shell: |
    gpg --dearmor < {{ vscode_keyring }} > {{ vscode_keyring }}.gpg
    mv {{ vscode_keyring }}.gpg {{ vscode_keyring }}
  when: vscode_key_download is succeeded
  tags: ['vscode', 'apt_key']

- name: Set VS Code repository URL based on architecture
  ansible.builtin.set_fact:
    vscode_repo: "deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by={{ vscode_keyring }}] https://packages.microsoft.com/repos/code stable main"
  tags: ['vscode']

- name: Add VS Code repository
  become: yes
  ansible.builtin.apt_repository:
    repo: "{{ vscode_repo }}"
    filename: vscode
    state: present
  tags: ['vscode', 'repository']

- name: Install Visual Studio Code
  become: yes
  ansible.builtin.apt:
    name: code
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: vscode_install_result
  retries: 3
  delay: 5
  tags: ['vscode', 'install']

- name: Verify VS Code installation
  become: yes
  ansible.builtin.command: code --version --no-sandbox --user-data-dir=/tmp/vscode-test 2>&1 || dpkg -l | grep -i code
  register: vscode_version
  changed_when: false
  failed_when: false
  when: vscode_install_result is succeeded
  tags: ['vscode']

- name: Print message after VS Code installation
  ansible.builtin.debug:
    msg: |
      "Visual Studio Code has been successfully installed and version is
       {{ vscode_version.stdout_lines[0] | default('installed') }}"
  when: vscode_install_result is succeeded
  tags: ['vscode']

# -----------------------------------------------------------------------------#
# ------------------------K9S---------------------------------------------------#

- name: Set k9s architecture and download URL
  ansible.builtin.set_fact:
    k9s_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'x86_64' }}"
  tags: ['k9s']

- name: Set k9s download URL
  ansible.builtin.set_fact:
    k9s_download_url: "{{ k9s_base_url }}/{{ k9s_version }}/k9s_Linux_{{ k9s_arch }}.tar.gz"
  tags: ['k9s']

- name: Check if k9s is already installed
  ansible.builtin.command: k9s version
  register: k9s_check
  failed_when: false
  changed_when: false
  tags: ['k9s']

- name: Download k9s
  become: yes
  ansible.builtin.get_url:
    url: "{{ k9s_download_url }}"
    dest: "{{ temp_dir }}/k9s.tar.gz"
    mode: '0644'
  when: k9s_check.rc != 0
  register: k9s_download_result
  retries: 3
  delay: 5
  tags: ['k9s', 'download']

- name: Create k9s extraction directory
  become: yes
  ansible.builtin.file:
    path: "{{ temp_dir }}/k9s"
    state: directory
    mode: '0755'
  when: k9s_download_result is succeeded
  tags: ['k9s']

- name: Extract k9s binary
  become: yes
  ansible.builtin.unarchive:
    src: "{{ temp_dir }}/k9s.tar.gz"
    dest: "{{ temp_dir }}/k9s"
    remote_src: yes
  when: k9s_download_result is succeeded
  tags: ['k9s']

- name: Install k9s binary
  become: yes
  ansible.builtin.copy:
    src: "{{ temp_dir }}/k9s/k9s"
    dest: "{{ k9s_binary_path }}"
    mode: '0755'
    remote_src: yes
  when: k9s_download_result is succeeded
  tags: ['k9s', 'install']

- name: Verify k9s installation
  become: yes
  ansible.builtin.command: k9s version
  register: k9s_version_output
  changed_when: false
  when: k9s_download_result is succeeded or k9s_check.rc == 0
  tags: ['k9s']

- name: Print message after k9s installation
  ansible.builtin.debug:
    msg: |
      "k9s has been successfully installed and version is
       {{ k9s_version_output.stdout_lines[0] | default('installed') }}"
  when: k9s_download_result is succeeded or k9s_check.rc == 0
  tags: ['k9s']

# -----------------------------------------------------------------------------#
# ------------------------AZURE CLI--------------------------------------------#

