---
# -----------------------------------------------------------------------#
# ------------------------Pre-requisite Packages-------------------------#

- name: fix broken Packages.
  become: yes
  ansible.builtin.shell: apt --fix-broken install -y
  ignore_errors: yes

- name: Update the server
  become: yes
  ansible.builtin.apt:
    upgrade: 'safe'
    update_cache: true
  tags: ['update', 'server']

- name: Install Pre-requisite Packages
  become: yes
  ansible.builtin.apt:
    name: "{{ prereq_pkgs }}"
    state: 'present'
  tags: ['install', 'packages', 'devops']

# ---------------------------------------------------------------------------#
# ------------------------AWS_CLI--------------------------------------------#

- name: Uninstall AWS CLI V1
  become: yes
  ansible.builtin.apt:
    name: 'awscli'
    state: 'absent'
  tags: ['uninstall', 'awscli']

- name: Delete the old AWS CLI V2 temp files
  become: false
  ansible.builtin.file:
    path: "{{ temp_dir }}/aws"
    state: 'absent'
  tags: ['cleanup', 'awscli']

- name: Download and unzip the AWS CLI V2
  become: false
  ansible.builtin.unarchive:
    src: "{{ aws_cli_repo }}"
    dest: "{{ temp_dir }}"
    remote_src: true
  tags: ['download', 'awscli']
  retries: 3
  delay: 5

- name: Run the AWS CLI V2 installer
  become: yes
  ansible.builtin.shell: "{{ temp_dir }}/aws/install --update"
  tags: ['install', 'awscli']
  register: download_result
  until: download_result is succeeded
  retries: 3
  delay: 10

- name: Verify AWS CLI installation and print version
  become: yes
  ansible.builtin.command: aws --version
  register: aws_version
  changed_when: false
  when: download_result is succeeded

- name: Print message after AWS CLI installation
  ansible.builtin.debug:
    msg: |
       "AWS CLI has been successfully installed and version is
        {{ aws_version.stdout.split(' ')[0] }}"
  when: download_result is succeeded

# -----------------------------------------------------------------------------#
# ------------------------KUBECTL----------------------------------------------#

- name: Install Pre-requisite Packages
  become: yes
  ansible.builtin.apt:
    name: "{{ prereq_pkgs }}"
    state: present

- name: Add kubectl apt key
  become: yes
  ansible.builtin.apt_key:
    url: "{{ kubectl_apt_key }}"
    state: present
    keyring: "{{ kubectl_keyring }}"
  tags: ['kubectl', 'apt_key']

- name: Add kubectl repository
  become: yes
  ansible.builtin.apt_repository:
    repo: "{{ kubectl_repo }}"
    filename: kubernetes
  tags: ['kubectl', 'repository']

- name: Install kubectl
  become: yes
  ansible.builtin.apt:
    name: kubectl
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: download_result
  until: download_result is succeeded
  retries: 3
  delay: 10
  tags: ['kubectl', 'install']

- name: Verify Kubectl installation and print version
  become: yes
  ansible.builtin.command: kubectl version --client
  register: kubectl_version_output
  changed_when: false
  when: download_result is succeeded

- name: Print message after Kubectl installation
  ansible.builtin.debug:
    msg: |
      "Kubectl has been successfully installed and
        {{ kubectl_version_output.stdout_lines[0] }}"
  when: download_result is succeeded

# -----------------------------------------------------------------------------#
# ------------------------HELM-------------------------------------------------#

- name: Add Helm apt key
  become: yes
  ansible.builtin.apt_key:
    url: "{{ helm_apt_key }}"
    state: present
  tags: ['helm', 'apt_key']

- name: Add Helm repository
  become: yes
  ansible.builtin.apt_repository:
    repo: "{{ helm_repo_url }}"
    filename: helm
  tags: ['helm', 'repository']

- name: Install Helm and enable auto-completion
  become: yes
  block:
    - name: Install Helm
      ansible.builtin.apt:
        name: helm
        state: present
        update_cache: true
        cache_valid_time: 3600
      register: download_result
      until: download_result is succeeded
      retries: 3
      delay: 10
      tags: ['helm', 'install']

    - name: Check if bash_completion.d directory exists
      ansible.builtin.stat:
        path: /etc/bash_completion.d
      register: bash_completion_dir
      tags: ['helm', 'completion']

    - name: Create bash_completion.d directory if it does not exist
      ansible.builtin.file:
        path: /etc/bash_completion.d
        state: directory
        mode: '0755'
      when: not bash_completion_dir.stat.exists
      tags: ['helm', 'completion']

    - name: Enable Helm auto-completion
      become: yes
      ansible.builtin.shell: helm completion bash > /etc/bash_completion.d/helm
      args:
        creates: /etc/bash_completion.d/helm
      tags: ['helm', 'completion']

- name: Verify Helm installation
  become: yes
  ansible.builtin.command: helm version --short
  register: helm_version
  changed_when: false
  when: download_result is succeeded

- name: Print message after Kubectl installation
  ansible.builtin.debug:
    msg: |
      "Helm has been successfully installed and version is
         {{ helm_version.stdout_lines[0].split('+')[0] }}"
  when: download_result is succeeded

# -------------------------------------------------------#
# ------------------------DOCKER-------------------------#

- name: Update apt
  become: yes
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Add Docker GPG Key
  become: yes
  ansible.builtin.apt_key:
    url: "{{ docker_apt_url }}"
    state: present

- name: Add Docker Repository
  become: yes
  ansible.builtin.apt_repository:
    repo: "{{ docker_repo }}"

- name: Update apt
  become: yes
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install Docker
  become: yes
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
  register: download_result
  until: download_result is succeeded
  retries: 3
  delay: 10
  notify: restart docker
  tags: ['docker', 'install']

- name: Verify Docker installation and print version
  become: yes
  ansible.builtin.command: docker --version
  register: docker_version
  changed_when: false
  when: download_result is succeeded

- name: Print message after docker installation
  ansible.builtin.debug:
    msg: "Docker has been successfully installed and
      {{ docker_version.stdout_lines[0] }}"
  when: download_result is succeeded

# ---------------------------------------------------------------#
# ------------------------DOCKER-COMPOSE-------------------------#

- name: Download and install docker-compose
  become: yes
  ansible.builtin.get_url:
    url: "{{ docker_compose_url }}"
    dest: /usr/local/bin/docker-compose
    mode: 'u+x,g+x'
    timeout: 30
  register: download_result
  until: download_result is succeeded
  retries: 5
  delay: 10

- name: Ensure Docker group exists
  become: yes
  ansible.builtin.group:
    name: docker
    state: present

- name: Add User to Docker Group
  become: yes
  ansible.builtin.user:
    append: true
    groups: docker
    name: "{{ ansible_user_id }}"

- name: Verify Docker-compose installation and print version
  become: yes
  ansible.builtin.command: docker-compose version --short
  register: docker_compose_version
  changed_when: false
  when: download_result is succeeded

- name: Print message after docker-compose installation
  ansible.builtin.debug:
    msg: |
     "Docker-compose has been successfully installed and
       {{ docker_compose_version.stdout }}"
  when: download_result is succeeded

# -------------------------------------------------------#
# ------------------------Git----------------------------#

- name: Install git
  become: yes
  ansible.builtin.apt:
    name: git
    state: present
    update_cache: true
  register: download_result

- name: Create user dir
  become: yes
  ansible.builtin.file:
    path: /home/{{ ansible_user }}
    state: directory

- name: Copy git config
  become: yes
  ansible.builtin.template:
    src: gitconfig.j2
    dest: "/home/{{ ansible_user }}/.gitconfig"
    owner: "{{ ansible_user }}"
    mode: 0640

- name: Verify Git installation and print version
  become: yes
  ansible.builtin.command: git --version
  register: git_version
  changed_when: false
  when: download_result is succeeded

- name: Print message after git installation
  ansible.builtin.debug:
    msg: "Git has been successfully installed and {{ git_version.stdout }}"
  when: download_result is succeeded

# -------------------------------------------------------#
# ------------------------Lens---------------------------#

- name: Import Lens Desktop public security key
  become: yes
  ansible.builtin.apt_key:
    url: "{{ lens_apt_url }}"
    state: present
    keyring: "{{ lens_keyring }}"

- name: Add the Lens Desktop repository
  become: yes
  ansible.builtin.apt_repository:
    repo: "{{ lens_repository }}"
    state: present
    filename: lens

- name: Set priority for the stable channel
  become: yes
  ansible.builtin.copy:
    content: |
      Package: *
      Pin: release a=stable
      Pin-Priority: 800
    dest: /etc/apt/preferences.d/lens
    mode: '0644'

- name: Install or update Lens Desktop
  become: yes
  ansible.builtin.apt:
    update_cache: true
    name: lens
    state: present
  register: download_result
  until: download_result is succeeded
  retries: 3
  delay: 10

- name: Print message after Lens installation
  ansible.builtin.debug:
    msg: "Lens has been successfully installed."
  when: download_result is succeeded

# -------------------------------------------------------#
# ------------------------TF_SWITCH-------------------------#

- name: Check if tfswitch is already installed
  become: false
  ansible.builtin.command: which tfswitch
  register: tfswitch_check
  failed_when: false
  changed_when: false

- name: Download and execute the tf-switcher installation script
  become: yes
  ansible.builtin.shell: "{{ tfswitch_url }}"
  register: download_result
  when: tfswitch_check.rc != 0
  retries: 3
  delay: 5

- name: Verify tfswitch installation and print version
  become: yes
  ansible.builtin.command: tfswitch --version
  register: tfswitch_version
  changed_when: false
  when: download_result is succeeded or tfswitch_check.rc == 0

- name: Print message after tfswitch installation
  ansible.builtin.debug:
    msg: |
     "tfswitch has been successfully installed and
       {{ tfswitch_version.stdout }}"
  when: tfswitch_version is defined
...
