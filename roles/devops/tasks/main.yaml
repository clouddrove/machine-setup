    mode: '0644'
  tags: ['azure', 'apt_key']

- name: Set Azure CLI repository URL based on architecture
  ansible.builtin.set_fact:
    azure_cli_repo: "deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by={{ azure_cli_keyring }}] https://packages.microsoft.com/repos/azure-cli/ {{ ansible_distribution_release }} main"
  tags: ['azure']

- name: Add Azure CLI repository
  become: yes
  ansible.builtin.apt_repository:
    repo: "{{ azure_cli_repo }}"
    filename: azure-cli
    state: present
  tags: ['azure', 'repository']

- name: Install Azure CLI
  become: yes
  ansible.builtin.apt:
    name: azure-cli
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: azure_install_result
  retries: 3
  delay: 5
  tags: ['azure', 'install']

- name: Verify Azure CLI installation
  become: yes
  ansible.builtin.command: az --version
  register: azure_version
  changed_when: false
  when: azure_install_result is succeeded
  tags: ['azure']

- name: Print message after Azure CLI installation
  ansible.builtin.debug:
    msg: |
      "Azure CLI has been successfully installed and version is
       {{ azure_version.stdout_lines[0] | default('installed') }}"
  when: azure_install_result is succeeded
  tags: ['azure']

