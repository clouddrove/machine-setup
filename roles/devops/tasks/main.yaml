# -----------------------------------------------------------------------------#
# ------------------------ANSIBLE-----------------------------------------------#

- name: Check if Ansible is already installed
  ansible.builtin.command: ansible --version
  register: ansible_check
  failed_when: false
  changed_when: false
  tags: ['ansible']

- name: Install Ansible via pip
  become: yes
  ansible.builtin.pip:
    name: ansible
    state: present
    executable: pip3
  when: ansible_check.rc != 0 and ansible_install_method == 'pip'
  register: ansible_install_result
  retries: 3
  delay: 5
  tags: ['ansible', 'install']

- name: Install Ansible via apt
  become: yes
  ansible.builtin.apt:
    name: ansible
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_check.rc != 0 and ansible_install_method == 'apt'
  register: ansible_install_result
  retries: 3
  delay: 5
  tags: ['ansible', 'install']

- name: Verify Ansible installation
  become: yes
  ansible.builtin.command: ansible --version
  register: ansible_version
  changed_when: false
  when: ansible_install_result is succeeded or ansible_check.rc == 0
  tags: ['ansible']

- name: Print message after Ansible installation
  ansible.builtin.debug:
    msg: |
      "Ansible has been successfully installed and version is
       {{ ansible_version.stdout_lines[0] | default('installed') }}"
  when: ansible_install_result is succeeded or ansible_check.rc == 0
  tags: ['ansible']
