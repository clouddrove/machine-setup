---
name: YAML-LINTER
on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - '**/*.yml'
      - '**/*.yaml'
      - '.yamllint'
      - '.github/workflows/lint.yaml'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - '**/*.yml'
      - '**/*.yaml'
      - '.yamllint'
      - '.github/workflows/lint.yaml'
  workflow_dispatch:

jobs:
  yaml-lint:
    name: YAML-LINTER
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint

      - name: Run yamllint
        run: |
          yamllint --version
          yamllint -d .yamllint .
